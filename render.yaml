services:
  - type: web
    name: drift-inspection-platform
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm drizzle-kit migrate && pnpm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: VITE_APP_ID
        sync: false
      - key: VITE_APP_TITLE
        sync: false
      - key: VITE_APP_LOGO
        sync: false
      - key: VITE_OAUTH_PORTAL_URL
        sync: false
      - key: FRONTEND_APP_URL
        sync: false
      - key: DRIFT_ALLOWED_ORIGINS
        sync: false
      - key: OAUTH_SERVER_URL
        sync: false
      - key: OWNER_OPEN_ID
        sync: false
      - key: BUILT_IN_FORGE_API_URL
        sync: false
      - key: BUILT_IN_FORGE_API_KEY
        sync: false
      - key: VITE_FRONTEND_FORGE_API_URL
        sync: false
      - key: VITE_FRONTEND_FORGE_API_KEY
        sync: false
      - key: DRIFT_INGEST_TOKEN
        sync: false
      - key: ML_INFERENCE_URL
        sync: false
      - key: ML_INFERENCE_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DRIFT_EMAIL_WEBHOOK_URL
        sync: false
      - key: DRIFT_SMTP_HOST
        sync: false
      - key: DRIFT_SMTP_PORT
        value: "465"
      - key: DRIFT_SMTP_SECURE
        value: "true"
      - key: DRIFT_SMTP_USER
        sync: false
      - key: DRIFT_SMTP_PASS
        sync: false
      - key: DRIFT_HARDWARE_ENDPOINT
        sync: false
